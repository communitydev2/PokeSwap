<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Your sign-in code</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #222; padding: 24px;">
    <h1 style="font-size: 24px;">Your sign-in code</h1>
    <p style="font-size: 36px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
    <p>Type this code into the sign-in screen. It expires in an hour.</p>
    <p>Or sign in on this device:</p>
    <p><a href="{{ .ConfirmationURL }}">Sign in</a></p>
  </body>
</html>
